<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self'; img-src 'self' data:; media-src 'self' blob:; connect-src 'self'">
<title>Nexus</title><link rel="stylesheet" href="style.css"></head>
<body data-state="idle">
  <div id="bubble" class="hit"><div id="bubbleText"></div>
    <div id="approval" hidden>
      <div id="apSummary"></div>
      <div id="apStrong" hidden><input id="apInput" placeholder='type: yes submit' autocomplete="off"></div>
      <div class="apBtns"><button id="apYes" class="go">Approve</button><button id="apNo" class="no">Cancel</button></div>
    </div>
    <div id="meta"></div>
  </div>

  <div id="char">
    <div class="grip hit" title="drag to move"></div>
    <img id="portrait" class="hit" src="assets/nexus.png" alt="Nexus" draggable="false">
  </div>

  <div id="listenBar" class="hit" hidden><i id="dot"></i><span id="listenText"></span><button id="listenOff">MIC OFF</button></div>

  <div id="dock" class="hit">
    <button id="mic" title="Talk (Ctrl+Shift+Space)">MIC</button>
    <button id="lang" title="Voice language: auto / English / Tamil">auto</button>
    <input id="input" placeholder="Talk to Nexus..." autocomplete="off">
    <button id="send">GO</button>
    <button id="gear" title="Settings, memory">SET</button>
  </div>

  <div id="panel" class="hit" hidden>
    <div class="ph"><b>NEXUS // SETTINGS</b><button id="closePanel">X</button></div>
    <section><h4>BRAIN</h4>
      <div class="row"><span>Groq key</span><b id="keyState">none</b></div>
      <div class="row"><input id="keyInput" type="password" placeholder="paste Groq key here (stays on this laptop)" autocomplete="off"><button id="keySave">Save</button><button id="keyDel">Remove</button></div>
      <div class="row"><span>Private mode (local only)</span><label class="sw"><input type="checkbox" id="privateOn"><i></i></label></div>
      <div class="row"><span>Pause all actions</span><label class="sw"><input type="checkbox" id="pausedOn"><i></i></label></div>
      <div class="row"><span>Speak replies</span><label class="sw"><input type="checkbox" id="speakOn"><i></i></label></div>
      <div class="row"><span>Hands-free listening (mic always on)</span><label class="sw"><input type="checkbox" id="handsFreeOn"><i></i></label></div>
      <div class="row"><span>Only react after I say "Nexus"</span><label class="sw"><input type="checkbox" id="wakeOn"><i></i></label></div>
      <div class="row"><span>Voice</span><select id="voiceSel"></select><button id="voiceTest">Test</button></div>
      <div class="meter"><div id="meterFill"></div></div><div id="meterText" class="small"></div>
    </section>
    <section><h4>FOLDERS SHE MAY LIST WITHOUT ASKING</h4><div id="folders" class="small"></div><button id="addFolder">Add folder</button></section>
    <section><h4>MEMORY</h4><div id="facts"></div><button id="clearChat">Clear chat history</button></section>
  </div>
  <script src="app.js"></script>
</body></html>
